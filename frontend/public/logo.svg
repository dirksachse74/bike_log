<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Bike Log</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3A57"/>
      <stop offset="1" stop-color="#0E1F30"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(0 -24)">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- rear wheel -->
    <circle cx="140" cy="318" r="84" stroke="#FFFFFF" stroke-width="22"/>
    <!-- front wheel: track + mileage progress arc -->
    <circle cx="372" cy="318" r="84" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="22"/>
    <circle cx="372" cy="318" r="84" stroke="#2EC4B6" stroke-width="22"
            stroke-dasharray="396 528" transform="rotate(-90 372 318)"/>
    <!-- frame -->
    <path d="M140 318 L248 318 L214 196 Z M214 196 L338 196 L248 318 M338 196 L372 318"
          stroke="#FFFFFF" stroke-width="22"/>
    <!-- saddle -->
    <path d="M186 172 L240 172" stroke="#FFFFFF" stroke-width="20"/>
    <path d="M214 196 L208 172" stroke="#FFFFFF" stroke-width="16"/>
    <!-- stem and drop bar -->
    <path d="M338 196 L334 166 L364 160 C388 156 392 186 372 194" stroke="#FFFFFF" stroke-width="18"/>
  </g>
  <!-- chainring -->
  <circle cx="248" cy="318" r="22" fill="#2EC4B6"/>
  <circle cx="248" cy="318" r="8" fill="#0E1F30"/>
  </g>
</svg>
