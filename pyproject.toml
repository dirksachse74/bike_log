[project]
name = "bikelog"
dynamic = ["version"]
description = "Bike Log: local road-bike inventory and maintenance app"
requires-python = ">=3.12"

[project.scripts]
bikelog = "bikelog.launcher:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "backend"

[tool.setuptools.dynamic]
version = { attr = "bikelog.__version__" }

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
